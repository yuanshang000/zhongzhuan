version: "3.9"

services:
  # ---------- 应用 ----------
  app:
    build: .
    container_name: cloudrive-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-./document}
      DATABASE_URL: sqlite:////data/cloudrive.db
      MULTIPART_CHUNK_SIZE: ${MULTIPART_CHUNK_SIZE:-33554432}
      DIRECT_UPLOAD_THRESHOLD: ${DIRECT_UPLOAD_THRESHOLD:-8388608}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-cloudrive}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - appdata:/data
      # 存储目录挂载进容器。默认存到项目下的 document，可改为宿主机任意路径
      - ${LOCAL_STORAGE_DIR:-./document}:/data/storage
    depends_on:
      - minio

  # ---------- MinIO 对象存储（可选，STORAGE_BACKEND=s3 时启用）----------
  minio:
    image: minio/minio:latest
    container_name: cloudrive-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-cloudrive}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-cloudrive123456}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------- Nginx 反向代理（关键：关闭缓冲，实现不限速直传）----------
  nginx:
    image: nginx:alpine
    container_name: cloudrive-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ngdata:/var/cache/nginx
    depends_on:
      - app

volumes:
  appdata:
  miniodata:
  ngdata: