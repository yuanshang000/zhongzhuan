# CloudRive 反向代理
# 核心目标：大文件上传下载不限速（关闭所有缓冲，直通转发）

# 上传限制：设为 0 表示不限制，由应用自行控制
client_max_body_size 0;
client_body_timeout 3600s;

server {
    listen 80;
    server_name _;
    # 生产环境请启用 HTTPS 并 301 跳转
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ===== TLS =====
    # 自签证书（内网使用）。生产环境请替换为 Let's Encrypt 证书
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # ===== 性能 =====
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  75s;

    # ===== 上传：关闭请求缓冲 =====
    # 不缓冲则请求体直接流式传给上游，是不限速的关键
    proxy_request_buffering off;
    proxy_buffering         off;
    proxy_max_temp_file_size 0;

    # ZIP 打包下载是长连接流式响应，必须放宽超时
    proxy_connect_timeout  60s;
    proxy_send_timeout     3600s;
    proxy_read_timeout     3600s;

    gzip off;   # 压缩会拖慢大文件传输，且已占用 CPU

    # ===== 根路径：交给应用 =====
    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ===== 分片上传端点：不缓冲，进度实时 =====
    location ~ ^/api/files/(part|raw)/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # ===== ZIP 打包下载：彻底不缓冲 =====
    location ~ ^/api/files/[^/]+/download-zip {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
    }

    # ===== 静态资源缓存 =====
    location /static/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ===== MinIO 控制台（按需启用）=====
    # location /minio/ {
    #     proxy_pass http://minio:9001/;
    #     proxy_set_header Host $host;
    # }
}